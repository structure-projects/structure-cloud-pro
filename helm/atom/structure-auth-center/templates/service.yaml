{{- range $key, $svc := dict "backend" .Values.backend "backend2" .Values.backend2 "frontend" .Values.frontend }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "structure-auth-center.fullname" $ }}-{{ $svc.name }}
  labels:
    {{- include "structure-auth-center.labels" $ | nindent 4 }}
    app.service: {{ $svc.name }}
spec:
  type: {{ $svc.service.type }}
  ports:
    - port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "structure-auth-center.selectorLabels" $ | nindent 4 }}
    app.service: {{ $svc.name }}
{{- end }}
{{- end }}
