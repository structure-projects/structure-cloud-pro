{{- if .Values.autoscaling.enabled }}
{{- range $key, $svc := dict "backend" .Values.backend "backend2" .Values.backend2 "frontend" .Values.frontend }}
{{- if $svc.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "structure-auth-center.fullname" $ }}-{{ $svc.name }}
  labels:
    {{- include "structure-auth-center.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "structure-auth-center.fullname" $ }}-{{ $svc.name }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
