apiVersion: v1
kind: Pod
metadata:
  name: "{{ include \"structure-user-center.fullname\" . }}-test-connection"
  labels:
    {{- include "structure-user-center.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-c', 'wget --spider -q http://{{ include \"structure-user-center.fullname\" . }}-frontend:80']
  restartPolicy: Never
