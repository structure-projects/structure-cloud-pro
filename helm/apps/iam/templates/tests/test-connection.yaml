apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "iam.fullname" . }}-test-connection"
  labels:
    {{- include "iam.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-c', 'wget --spider -q http://{{ include "iam.fullname" . }}-gateway:8080']
  restartPolicy: Never
