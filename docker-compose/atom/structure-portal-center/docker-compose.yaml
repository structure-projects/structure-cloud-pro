version: "3.8"
services:
  portal-service:
    image: registry.cn-hangzhou.aliyuncs.com/structured/portal-service:2.0.0
    restart: always
    pull_policy: always
    hostname: portal-service
    env_file:
      - ../.env
    deploy:
      restart_policy:
        condition: on-failure
      replicas: 1
    networks:
      - structure-cloud-work
    environment:
      - APP_PATH=/app/boot/app.jar
      - JAVA_OPTS=-Xms256m -Xmx1024m
      - PARAMS=-Dfile.encoding=UTF-8 -Dspring.profiles.active=pro -Djava.security.egd=file:/dev/./urandom -Duser.timezone=Asia/Shanghai
    healthcheck:
      test: ["CMD","/bin/sh","/app/liveness.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "nacos-0.nacos:nacos"
      - "nacos-1.nacos:nacos"
      - "nacos-2.nacos:nacos"

  portal-console:
    image: registry.cn-hangzhou.aliyuncs.com/structured/portal-console:2.0.0
    restart: always
    pull_policy: always
    hostname: portal-console
    env_file:
      - ../.env
    deploy:
      restart_policy:
        condition: on-failure
      replicas: 1
    networks:
      - structure-cloud-work
    environment:
      - SCHEME=https
      - SERVER_HOST=api.prod.structured.cn
      - SERVER_PORT=443
    healthcheck:
      test: ["CMD","curl","-f","http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  portal-shell:
    image: registry.cn-hangzhou.aliyuncs.com/structured/portal-shell:2.0.0
    restart: always
    pull_policy: always
    hostname: portal-shell
    env_file:
      - ../.env
    deploy:
      restart_policy:
        condition: on-failure
      replicas: 1
    networks:
      - structure-cloud-work
    environment:
      - SCHEME=https
      - SERVER_HOST=api.prod.structured.cn
      - SERVER_PORT=443
    healthcheck:
      test: ["CMD","curl","-f","http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  portal-ssr:
    image: registry.cn-hangzhou.aliyuncs.com/structured/portal-ssr:2.0.0
    restart: always
    pull_policy: always
    hostname: portal-ssr
    env_file:
      - ../.env
    deploy:
      restart_policy:
        condition: on-failure
      replicas: 1
    networks:
      - structure-cloud-work
    environment:
      - SCHEME=https
      - SERVER_HOST=api.prod.structured.cn
      - SERVER_PORT=443
    healthcheck:
      test: ["CMD","curl","-f","http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  portal-miniapp-h5:
    image: registry.cn-hangzhou.aliyuncs.com/structured/portal-miniapp-h5:2.0.0
    restart: always
    pull_policy: always
    hostname: portal-miniapp-h5
    env_file:
      - ../.env
    deploy:
      restart_policy:
        condition: on-failure
      replicas: 1
    networks:
      - structure-cloud-work
    environment:
      - SCHEME=https
      - SERVER_HOST=api.prod.structured.cn
      - SERVER_PORT=443
    healthcheck:
      test: ["CMD","curl","-f","http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  structure-cloud-work:
    external: true
